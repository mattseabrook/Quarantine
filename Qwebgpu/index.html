<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quarantine · Qwebgpu</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <main>
    <canvas id="screen" width="320" height="200" tabindex="-1" aria-label="Quarantine game screen" hidden></canvas>
    <div id="restoreChoice" aria-label="Restore this game?" hidden>
      <button type="button" value="y">Yes</button>
      <button type="button" value="n">No</button>
    </div>
    <p id="checkpoint" role="status" hidden></p>
    <section id="launcher" aria-labelledby="title">
      <h1 id="title">Quarantine</h1>
      <p>Select your retail MS-DOS game folder. The engine reads its files on this device.</p>
      <label class="picker">Select game folder<input id="folder" type="file" webkitdirectory multiple></label>
      <button id="start" disabled>Start</button>
      <p id="status" role="status"></p>
    </section>
    <form id="answerForm" class="sr" hidden>
      <label for="answer">Flesh ratio factor</label>
      <input id="answer" type="text" inputmode="numeric" enterkeyhint="go" autocomplete="off" aria-describedby="question">
      <span id="question" class="sr" aria-live="polite"></span>
      <button>Enter</button>
    </form>
    <noscript>Enable JavaScript to load the engine.</noscript>
  </main>
</body>
</html>
